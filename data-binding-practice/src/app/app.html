
<!--string interpolation-->
<h1>String interpolation</h1>
<p class={{cname}}>{{showName()}}</p>  <!--interpolation-->
<p>{{studentName}}</p> <!--interpolation-->
<p>{{100 * 3}}</p>  <!--interpolation-->
<img src={{myImage}} alt="no image" class="my-image"/>  <!--interpolation-->
<p>{{d}}</p> <!--interpolation-->


<!--property binding practice-->
<h1>Property binding</h1>
Name: <input [value]=inputValue/> <button class="btn btn-primary m-2" [disabled]=isdisabled>Submit</button> <br>
Mobile: <input [hidden]=ishidden/>
<p [textContent]=playerName></p>

<!--class binding-->


<h1 [class.active]='isActive' [class.inactive]="!isActive">Employee Status</h1>
<button (click)="changeStatus()">Change Status</button>

<h1 [class]="isActive ? 'active' : 'inactive'">Employee Status</h1>

<h1 [class.myactive]="isactive" [class.large]="isLarge" [class.highlighted]="isHighlighted">Employee Details</h1>
